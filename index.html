<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>巴顿弹幕英雄连2</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            line-height: 1.5;
        }
        a {
            color: #58b9ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        img {
            display: block;
            max-width: 100%;
        }
        .app {
            max-width: 1300px;
            margin: 0 auto;
            padding: 12px 16px 40px;
        }
        .header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 18px;
            padding: 16px 0 12px;
            border-bottom: 1px solid #2a313c;
            margin-bottom: 18px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3d4a5a;
            flex-shrink: 0;
            background: #1e2630;
        }
        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f5d77b, #e8b84a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .header-right {
            margin-left: auto;
            font-size: 0.95rem;
            background: #1a222c;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #2e3a48;
            white-space: nowrap;
        }
        .header-right a {
            color: #7fc9ff;
            font-weight: 500;
        }
        .header-right a:hover {
            color: #b0dfff;
            text-decoration: none;
        }

        .live-section {
            margin-bottom: 28px;
            border-radius: 14px;
            overflow: hidden;
            background: #131b24;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #26313e;
            position: relative;
            width: 100%;
        }
        .live-wrapper {
            width: 100%;
            position: relative;
            overflow: hidden;
            padding-top: 56.25%;
        }
        .live-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* 直播状态徽标 */
        .live-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .live-badge.live {
            background: #e04848;
            color: #fff;
        }
        .live-badge.offline {
            background: #3a4a5a;
            color: #b0c8dd;
        }

        .units-section {
            margin-top: 10px;
        }

        .faction-tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a313c;
            padding-bottom: 8px;
        }
        .faction-tab {
            padding: 8px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            background: transparent;
            border: none;
            color: #8a9eb0;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .faction-tab:hover {
            color: #d0ddee;
            background: #1a222c;
        }
        .faction-tab.active {
            color: #fff;
            background: #2a3a4e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .faction-tab .icon-soviet {
            color: #cc3333;
        }
        .faction-tab .icon-nazi {
            color: #b0b0b0;
        }

        .tag-group {
            margin-bottom: 20px;
            border: 1px solid #26313e;
            border-radius: 10px;
            overflow: hidden;
            background: #111a24;
        }
        .tag-group.collapsed .gift-group-wrapper {
            display: none;
        }
        .tag-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            font-size: 1.05rem;
            font-weight: 600;
            background: #1e2835;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
            border-bottom: 1px solid transparent;
            color: #c8d6e5;
            letter-spacing: 0.5px;
        }
        .tag-label:hover {
            background: #263340;
        }
        .tag-label .arrow {
            font-size: 0.8rem;
            transition: transform 0.25s;
            color: #7a8fa8;
        }
        .tag-group.collapsed .tag-label .arrow {
            transform: rotate(-90deg);
        }
        .gift-group-wrapper {
            padding: 12px 16px 16px;
        }

        .gift-group {
            background: #0f1822;
            border-radius: 10px;
            padding: 12px 14px 14px;
            margin-bottom: 14px;
            border: 1px solid #1f2b38;
            transition: border-color 0.2s;
        }
        .gift-group:last-child {
            margin-bottom: 0;
        }
        .gift-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #1f2b38;
        }
        .gift-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #4a5a6e;
            background: #1e2835;
            flex-shrink: 0;
        }
        .gift-name {
            font-weight: 600;
            font-size: 1.0rem;
            color: #f0e6c5;
        }
        .gift-badge {
            background: #1f2b39;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.82rem;
            color: #b8cbdf;
            border: 1px solid #324252;
            white-space: nowrap;
        }
        .gift-description {
            font-size: 0.82rem;
            color: #a0b8cf;
            background: #0d1822;
            padding: 6px 12px;
            border-radius: 6px;
            margin: 6px 0 10px 0;
            border-left: 3px solid #4a6a8a;
            line-height: 1.6;
        }

        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        @media (max-width: 480px) {
            .unit-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
        }

        .unit-card {
            background: #17212b;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            border: 1px solid #2b3848;
            display: flex;
            flex-direction: column;
        }
        .unit-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-color: #4d637f;
        }
        .unit-card-slider {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #0d141d;
        }
        .unit-card-slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .unit-card-slider .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: 0.15s;
        }
        .unit-card-slider .arrow:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .unit-card-slider .arrow-left {
            left: 4px;
        }
        .unit-card-slider .arrow-right {
            right: 4px;
        }
        .unit-card-slider .arrow.hidden {
            display: none;
        }
        .unit-card-name {
            padding: 8px 10px 8px;
            font-weight: 600;
            font-size: 0.92rem;
            text-align: center;
            color: #dce4ef;
            background: #0f1822;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #16202b;
            border-radius: 18px;
            max-width: 720px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 20px 24px 28px;
            border: 1px solid #3b4c60;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: #2a3a4c;
            border: none;
            color: #e0e8f0;
            font-size: 1.6rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 10;
            margin-bottom: 6px;
        }
        .modal-close:hover {
            background: #3f556b;
            transform: rotate(90deg);
        }
        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 6px 0 12px;
            color: #f0e8d0;
        }
        .modal-carousel {
            position: relative;
            background: #0d141d;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
            aspect-ratio: 16 / 10;
        }
        .modal-carousel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a111a;
        }
        .carousel-nav {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .carousel-nav button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-nav button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .carousel-nav .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            cursor: pointer;
            padding: 0;
            transition: 0.2s;
            align-self: center;
        }
        .carousel-nav .dot.active {
            background: #ffd966;
            transform: scale(1.2);
        }

        .modal-description {
            font-size: 0.98rem;
            color: #c6d4e3;
            line-height: 1.7;
            background: #0f1924;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 10px 0 14px;
            border-left: 3px solid #e8b84a;
        }
        .modal-video {
            border-radius: 10px;
            overflow: hidden;
            background: #0a111a;
            margin-top: 6px;
        }
        .modal-video video {
            width: 100%;
            display: block;
            max-height: 50vh;
            background: #000;
        }

        .loading-text {
            text-align: center;
            padding: 40px 0;
            color: #7a8fa8;
            font-size: 1.1rem;
        }

        .modal-box::-webkit-scrollbar {
            width: 6px;
        }
        .modal-box::-webkit-scrollbar-track {
            background: #0f1822;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <img src="profile.jpg" alt="avatar" class="avatar" id="avatarImg">
                <span class="site-title">巴顿弹幕英雄连2</span>
            </div>
            <div class="header-right">
                <a href="https://live.bilibili.com/1987060053" target="_blank" rel="noopener">直播 &gt;</a>
            </div>
        </header>

        <!-- 直播区域（动态切换直播/视频） -->
        <div class="live-section" id="liveSection">
            <div class="live-wrapper" id="liveWrapper">
                <!-- 直播 iframe -->
                <iframe id="liveIframe"
                    src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=1987060053"
                    allowfullscreen="true">
                </iframe>
                <!-- 视频 iframe（默认隐藏） -->
                <iframe id="videoIframe"
                    src=""
                    allowfullscreen="true"
                    style="display:none;">
                </iframe>
                <!-- 状态徽标 -->
                <div class="live-badge" id="liveBadge">检测中...</div>
            </div>
        </div>

        <section class="units-section" id="unitsContainer">
            <div class="loading-text">加载单位数据...</div>
        </section>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-title" id="modalTitle">单位名称</div>
            <div class="modal-carousel">
                <img id="modalCarouselImg" src="" alt="单位图片">
                <div class="carousel-nav" id="carouselNav"></div>
            </div>
            <div class="modal-description" id="modalDesc">介绍文字</div>
            <div class="modal-video">
                <video id="modalVideo" controls preload="metadata" playsinline>
                    <source src="" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
        </div>
    </div>

    <script>
        // ======================================================
        //  1. 直播状态检测 & 切换
        // ======================================================
        (function() {
            const ROOM_ID = 1987060053;                 // 直播间号
            // ⚠️ 请将下面的 BVID 替换为您想要播放的视频稿件的 BVID
            // 从 https://space.bilibili.com/506862539 中获取
            const VIDEO_BVID = 'BV1gEu66REHQ';          // 示例，请替换

            const liveIframe = document.getElementById('liveIframe');
            const videoIframe = document.getElementById('videoIframe');
            const badge = document.getElementById('liveBadge');

            function setLiveMode() {
                liveIframe.style.display = 'block';
                videoIframe.style.display = 'none';
                badge.textContent = '🔴 直播中';
                badge.className = 'live-badge live';
            }

            function setVideoMode() {
                liveIframe.style.display = 'none';
                videoIframe.style.display = 'block';
                // 设置视频源（若未设置）
                if (!videoIframe.src) {
                    videoIframe.src = `https://player.bilibili.com/player.html?bvid=${VIDEO_BVID}&page=1`;
                }
                badge.textContent = '🎬 视频轮播';
                badge.className = 'live-badge offline';
            }

            // 请求直播状态
            async function checkLiveStatus() {
                try {
                    const resp = await fetch(
                        `https://api.live.bilibili.com/room/v1/Room/get_info?room_id=${ROOM_ID}`
                    );
                    const json = await resp.json();
                    if (json.code === 0 && json.data) {
                        const status = json.data.live_status; // 0未开播 1直播中 2轮播
                        if (status === 1) {
                            setLiveMode();
                        } else {
                            setVideoMode();
                        }
                    } else {
                        // API返回异常，默认显示视频
                        setVideoMode();
                    }
                } catch (error) {
                    console.warn('直播状态获取失败，将显示视频:', error);
                    setVideoMode();
                }
            }

            // 首次检测 & 每5秒轮询
            checkLiveStatus();
            setInterval(checkLiveStatus, 5000);
        })();

        // ======================================================
        //  2. 数据加载与渲染（原功能保留）
        // ======================================================
        function preloadImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = () => resolve(url);
                img.src = url;
            });
        }

        let allData = null;
        let currentFaction = '盟军';

        async function loadData() {
            try {
                const resp = await fetch('data.json');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                allData = await resp.json();

                // 1. 礼物图标
                await preloadGiftIcons(allData);
                renderFactionTabs();
                renderFaction('盟军', true);

                // 2. 缩略图
                await preloadThumbnails(allData);
                expandAllTags();

                // 3. 大图静默
                preloadModalImages(allData);

            } catch (err) {
                document.getElementById('unitsContainer').innerHTML =
                    `<div class="loading-text" style="color:#e66767;">数据加载失败：${err.message}</div>`;
                console.error(err);
            }
        }

        function collectGiftUrls(data) {
            const urls = [];
            for (const f of ['盟军', '帝国']) {
                const fd = data[f];
                if (!fd) continue;
                for (const tag of ['步兵', '装甲', '远程']) {
                    const td = fd[tag];
                    if (!td) continue;
                    for (const g in td) {
                        if (td[g].image) urls.push(`礼物/${td[g].image}`);
                    }
                }
            }
            return [...new Set(urls)];
        }

        async function preloadGiftIcons(data) {
            const urls = collectGiftUrls(data);
            await Promise.all(urls.map(preloadImage));
        }

        function collectThumbnailUrls(data) {
            const urls = [];
            for (const f of ['盟军', '帝国']) {
                const fd = data[f];
                if (!fd) continue;
                for (const tag of ['步兵', '装甲', '远程']) {
                    const td = fd[tag];
                    if (!td) continue;
                    for (const g in td) {
                        const gift = td[g];
                        if (!gift.units) continue;
                        for (const unit of gift.units) {
                            if (unit.thumbnail) {
                                for (const t of unit.thumbnail) {
                                    urls.push(`${f}/${t}`);
                                }
                            }
                        }
                    }
                }
            }
            return [...new Set(urls)];
        }

        async function preloadThumbnails(data) {
            const urls = collectThumbnailUrls(data);
            await Promise.all(urls.map(preloadImage));
        }

        function collectModalUrls(data) {
            const urls = [];
            for (const f of ['盟军', '帝国']) {
                const fd = data[f];
                if (!fd) continue;
                for (const tag of ['步兵', '装甲', '远程']) {
                    const td = fd[tag];
                    if (!td) continue;
                    for (const g in td) {
                        const gift = td[g];
                        if (!gift.units) continue;
                        for (const unit of gift.units) {
                            if (unit.images) {
                                for (const img of unit.images) {
                                    urls.push(`${f}/${img}`);
                                }
                            }
                        }
                    }
                }
            }
            return [...new Set(urls)];
        }

        function preloadModalImages(data) {
            const urls = collectModalUrls(data);
            urls.forEach(url => preloadImage(url));
        }

        function renderFactionTabs() {
            const container = document.getElementById('unitsContainer');
            container.innerHTML = '';
            const tabsDiv = document.createElement('div');
            tabsDiv.className = 'faction-tabs';
            const factions = ['盟军', '帝国'];
            const icons = { '盟军': '☭', '帝国': '✙' };
            const iconClass = { '盟军': 'icon-soviet', '帝国': 'icon-nazi' };
            factions.forEach(f => {
                const btn = document.createElement('button');
                btn.className = 'faction-tab' + (f === currentFaction ? ' active' : '');
                btn.dataset.faction = f;
                btn.innerHTML = `<span class="${iconClass[f]}">${icons[f]}</span> ${f}`;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.faction-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFaction = f;
                    renderFaction(f, false);
                });
                tabsDiv.appendChild(btn);
            });
            container.appendChild(tabsDiv);
            const wrapper = document.createElement('div');
            wrapper.id = 'factionContentWrapper';
            container.appendChild(wrapper);
        }

        function renderFaction(faction, collapsed = false) {
            const wrapper = document.getElementById('factionContentWrapper');
            wrapper.innerHTML = '';
            const fd = allData[faction];
            if (!fd) { wrapper.innerHTML = '<div class="loading-text">该阵营暂无数据</div>'; return; }
            const tagOrder = ['步兵', '装甲', '远程'];
            const tagLabels = { '步兵': '步兵', '装甲': '装甲', '远程': '远程' };
            for (const tag of tagOrder) {
                const td = fd[tag];
                if (!td || Object.keys(td).length === 0) continue;
                const group = document.createElement('div');
                group.className = 'tag-group' + (collapsed ? ' collapsed' : '');
                const label = document.createElement('div');
                label.className = 'tag-label';
                label.innerHTML = `${tagLabels[tag]} <span class="arrow">▼</span>`;
                label.addEventListener('click', () => group.classList.toggle('collapsed'));
                group.appendChild(label);
                const inner = document.createElement('div');
                inner.className = 'gift-group-wrapper';
                const giftNames = Object.keys(td).sort((a, b) => (td[a].value || 0) - (td[b].value || 0));
                for (const gName of giftNames) {
                    const gift = td[gName];
                    if (!gift || !gift.units || gift.units.length === 0) continue;
                    const gGroup = document.createElement('div');
                    gGroup.className = 'gift-group';
                    const header = document.createElement('div');
                    header.className = 'gift-header';
                    const icon = document.createElement('img');
                    icon.className = 'gift-icon';
                    icon.src = `礼物/${gift.image}`;
                    icon.alt = gName;
                    icon.loading = 'lazy';
                    icon.onerror = function() { this.src = 'profile.jpg'; };
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'gift-name';
                    nameSpan.textContent = gName;
                    const valueSpan = document.createElement('span');
                    valueSpan.className = 'gift-badge';
                    valueSpan.textContent = `🔋 ${gift.value || 0} 电池`;
                    const countSpan = document.createElement('span');
                    countSpan.className = 'gift-badge';
                    countSpan.textContent = `⚡出场 ×${gift.count || 1}`;
                    header.append(icon, nameSpan, valueSpan, countSpan);
                    gGroup.appendChild(header);
                    if (gift.description) {
                        const desc = document.createElement('div');
                        desc.className = 'gift-description';
                        desc.textContent = gift.description;
                        gGroup.appendChild(desc);
                    }
                    const grid = document.createElement('div');
                    grid.className = 'unit-grid';
                    for (const unit of gift.units) {
                        const card = createUnitCard(unit, faction);
                        grid.appendChild(card);
                    }
                    gGroup.appendChild(grid);
                    inner.appendChild(gGroup);
                }
                group.appendChild(inner);
                wrapper.appendChild(group);
            }
        }

        function createUnitCard(unit, faction) {
            const card = document.createElement('div');
            card.className = 'unit-card';

            const slider = document.createElement('div');
            slider.className = 'unit-card-slider';

            const img = document.createElement('img');
            const thumbs = unit.thumbnail && unit.thumbnail.length ? unit.thumbnail : ['profile.jpg'];
            let currentIdx = 0;
            img.src = faction + '/' + thumbs[0];
            img.alt = unit.name;
            img.onerror = function() { this.src = 'profile.jpg'; };
            slider.appendChild(img);

            if (thumbs.length > 1) {
                const leftBtn = document.createElement('button');
                leftBtn.className = 'arrow arrow-left';
                leftBtn.textContent = '‹';
                leftBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentIdx = (currentIdx - 1 + thumbs.length) % thumbs.length;
                    img.src = faction + '/' + thumbs[currentIdx];
                });
                slider.appendChild(leftBtn);

                const rightBtn = document.createElement('button');
                rightBtn.className = 'arrow arrow-right';
                rightBtn.textContent = '›';
                rightBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentIdx = (currentIdx + 1) % thumbs.length;
                    img.src = faction + '/' + thumbs[currentIdx];
                });
                slider.appendChild(rightBtn);
            }

            card.appendChild(slider);

            const nameDiv = document.createElement('div');
            nameDiv.className = 'unit-card-name';
            nameDiv.textContent = unit.name;
            card.appendChild(nameDiv);

            card.addEventListener('click', (e) => {
                if (e.target.closest('.arrow')) return;
                openModal(unit, faction);
            });

            return card;
        }

        let currentImages = [];
        let currentIndex = 0;

        function openModal(unit, faction) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const carouselImg = document.getElementById('modalCarouselImg');
            const nav = document.getElementById('carouselNav');
            const desc = document.getElementById('modalDesc');
            const video = document.getElementById('modalVideo');

            title.textContent = unit.name;

            let large = unit.images && unit.images.length ? unit.images : (unit.thumbnail || ['profile.jpg']);
            currentImages = large.map(name => faction + '/' + name);
            currentIndex = 0;

            const setImg = (idx) => {
                const src = currentImages[idx] || 'profile.jpg';
                carouselImg.src = src;
                carouselImg.onerror = function() {
                    if (unit.thumbnail && unit.thumbnail[idx]) {
                        this.src = faction + '/' + unit.thumbnail[idx];
                    } else {
                        this.src = 'profile.jpg';
                    }
                };
            };
            setImg(0);

            nav.innerHTML = '';
            if (currentImages.length > 1) {
                const left = document.createElement('button');
                left.textContent = '‹';
                left.addEventListener('click', (e) => { e.stopPropagation();
                    changeImage(-1, setImg); });
                nav.appendChild(left);
                for (let i = 0; i < currentImages.length; i++) {
                    const dot = document.createElement('button');
                    dot.className = 'dot' + (i === 0 ? ' active' : '');
                    dot.dataset.index = i;
                    dot.addEventListener('click', (e) => { e.stopPropagation();
                        goToImage(i, setImg); });
                    nav.appendChild(dot);
                }
                const right = document.createElement('button');
                right.textContent = '›';
                right.addEventListener('click', (e) => { e.stopPropagation();
                    changeImage(1, setImg); });
                nav.appendChild(right);
                nav.style.display = 'flex';
            } else {
                nav.style.display = 'none';
            }

            desc.textContent = unit.description || '暂无介绍。';
            const videoSrc = unit.video ? '视频/' + unit.video : '';
            if (videoSrc) {
                video.style.display = 'block';
                const source = video.querySelector('source');
                if (source) source.src = videoSrc;
                else {
                    const ns = document.createElement('source');
                    ns.src = videoSrc;
                    ns.type = 'video/mp4';
                    video.appendChild(ns);
                }
                video.load();
            } else {
                video.style.display = 'none';
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            window._modalSetImg = setImg;
        }

        function changeImage(delta, setImg) {
            const total = currentImages.length;
            if (total === 0) return;
            currentIndex = (currentIndex + delta + total) % total;
            goToImage(currentIndex, setImg);
        }

        function goToImage(index, setImg) {
            const total = currentImages.length;
            if (total === 0) return;
            currentIndex = Math.max(0, Math.min(index, total - 1));
            setImg(currentIndex);
            const dots = document.querySelectorAll('#carouselNav .dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            const video = document.getElementById('modalVideo');
            video.pause();
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft' && document.getElementById('modalOverlay').classList.contains('active')) {
                changeImage(-1, window._modalSetImg);
            }
            if (e.key === 'ArrowRight' && document.getElementById('modalOverlay').classList.contains('active')) {
                changeImage(1, window._modalSetImg);
            }
        });

        function expandAllTags() {
            document.querySelectorAll('.tag-group').forEach(g => g.classList.remove('collapsed'));
        }

        loadData();
        document.getElementById('avatarImg').onerror = function() { this.src = 'profile.jpg'; };
    </script>
</body>
</html>
