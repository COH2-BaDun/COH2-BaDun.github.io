<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B站巴顿英雄连2弹幕游戏</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0b0e0a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #5a7a4a;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7a9a6a;
        }

        /* ===== 顶部标题 ===== */
        .page-header {
            background: linear-gradient(135deg, #1a2a1a, #0d1a0d);
            border-bottom: 3px solid #7a9a5a;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
        .page-header .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .page-header .header-left .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid #7a9a5a;
            object-fit: cover;
            background: #1a221a;
            box-shadow: 0 0 16px rgba(90, 130, 70, 0.3);
        }
        .page-header .header-left .title-group h1 {
            font-size: 2.0rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #f5e6b0;
            text-shadow: 0 0 20px rgba(122, 154, 90, 0.5), 0 2px 4px rgba(0, 0, 0, 0.8);
        }
        .page-header .header-left .title-group h1 small {
            font-size: 1rem;
            color: #b8c8a8;
            letter-spacing: 2px;
            margin-left: 10px;
            font-weight: 400;
        }
        .page-header .sub-tag {
            font-size: 0.85rem;
            color: #9aaa8a;
            letter-spacing: 3px;
            margin-top: 2px;
        }
        @media (max-width: 900px) {
            .page-header .header-left .title-group h1 {
                font-size: 1.4rem;
            }
            .page-header .header-left .title-group h1 small {
                font-size: 0.8rem;
                display: block;
                margin-left: 0;
            }
            .page-header .header-left .avatar {
                width: 40px;
                height: 40px;
            }
        }
        @media (max-width: 520px) {
            .page-header {
                padding: 10px 14px;
            }
            .page-header .header-left .title-group h1 {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
        }

        /* ===== 直播间区域 ===== */
        .live-section {
            background: #0f130e;
            padding: 20px 30px;
            border-bottom: 2px solid #3a4a3a;
        }
        .live-section .live-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            background: #0a0c0a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #3a5a3a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }
        .live-section .live-wrapper .live-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: #1a221a;
            border-bottom: 1px solid #2a3a2a;
        }
        .live-section .live-wrapper .live-header .live-title {
            font-size: 1rem;
            color: #c8d8b8;
            font-weight: 600;
        }
        .live-section .live-wrapper .live-header .live-title i {
            color: #ff6b6b;
            margin-right: 8px;
            display: inline-block;
            animation: pulse-dot 1.2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .live-section .live-wrapper .live-header .goto-btn {
            background: #4a6a3a;
            color: #f5f0e0;
            border: none;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .live-section .live-wrapper .live-header .goto-btn:hover {
            background: #6a8a5a;
            transform: scale(1.04);
            box-shadow: 0 0 20px rgba(90, 130, 70, 0.4);
        }
        .live-section .live-wrapper .live-iframe {
            width: 100%;
            height: 380px;
            border: none;
            display: block;
            background: #0a0c0a;
        }
        .live-section .live-wrapper .live-iframe iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .live-section .live-wrapper .live-fallback {
            display: none;
            padding: 60px 20px;
            text-align: center;
            color: #8a9a7a;
            background: #0d120d;
        }
        .live-section .live-wrapper .live-fallback a {
            color: #b8d8a0;
            font-size: 1.2rem;
            text-decoration: none;
            border: 1px solid #4a6a3a;
            padding: 10px 32px;
            border-radius: 30px;
            display: inline-block;
            transition: 0.3s;
        }
        .live-section .live-wrapper .live-fallback a:hover {
            background: #2a3a2a;
            border-color: #7a9a5a;
        }

        /* ===== 单位展示区 ===== */
        .units-section {
            padding: 24px 30px 40px;
            max-width: 1440px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
            margin-bottom: 28px;
            padding: 16px 24px;
            background: #141a14;
            border-radius: 12px;
            border: 1px solid #2a3a2a;
        }
        .controls .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .controls .control-group .label {
            font-size: 0.85rem;
            color: #9aaa8a;
            font-weight: 600;
            letter-spacing: 1px;
            margin-right: 4px;
        }
        .controls .btn {
            background: #1f2a1f;
            color: #b8c8a8;
            border: 1px solid #3a4a3a;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .controls .btn:hover {
            background: #2a3a2a;
            border-color: #5a7a4a;
            color: #f0f0e0;
        }
        .controls .btn.active {
            background: #3a6a2a;
            border-color: #6a9a4a;
            color: #fff;
            box-shadow: 0 0 16px rgba(60, 130, 40, 0.3);
        }
        .controls .btn-faction {
            min-width: 80px;
        }
        .controls .btn-tag {
            min-width: 60px;
        }
        .controls .stats {
            margin-left: auto;
            font-size: 0.85rem;
            color: #8a9a7a;
            background: #0d120d;
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid #2a3a2a;
        }
        .controls .stats span {
            color: #d8e8c8;
            font-weight: 700;
        }

        /* ===== 礼物分组 ===== */
        .gift-group {
            margin-bottom: 32px;
            background: #121812;
            border-radius: 14px;
            border: 1px solid #2a3a2a;
            overflow: hidden;
            transition: all 0.3s;
        }
        .gift-group .gift-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 22px;
            background: #1a221a;
            border-bottom: 1px solid #2a3a2a;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            flex-wrap: wrap;
        }
        .gift-group .gift-header:hover {
            background: #1f2a1f;
        }
        .gift-group .gift-header .gift-icon {
            font-size: 1.6rem;
            line-height: 1;
        }
        .gift-group .gift-header .gift-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #f5e6b0;
        }
        .gift-group .gift-header .gift-battery {
            font-size: 0.9rem;
            color: #b8c8a8;
            background: #2a3a2a;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 600;
        }
        .gift-group .gift-header .gift-battery i {
            color: #ffd700;
            margin-right: 4px;
        }
        .gift-group .gift-header .gift-count {
            font-size: 0.85rem;
            color: #8a9a7a;
            margin-left: auto;
        }
        .gift-group .gift-header .gift-arrow {
            color: #5a7a4a;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .gift-group .gift-header .gift-arrow.open {
            transform: rotate(180deg);
        }
        .gift-group .gift-body {
            padding: 18px 22px 22px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }
        .gift-group .gift-body.collapsed {
            display: none;
        }

        /* ===== 单位卡片 ===== */
        .unit-card {
            background: #1a201a;
            border-radius: 12px;
            border: 1px solid #2a3a2a;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .unit-card:hover {
            transform: translateY(-4px);
            border-color: #5a7a4a;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }
        .unit-card .card-img {
            width: 100%;
            aspect-ratio: 16/10;
            background: #0d120d;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .unit-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }
        .unit-card .card-img img.load-error {
            object-fit: contain;
            padding: 12px;
            opacity: 0.6;
        }
        .unit-card .card-img .img-placeholder {
            color: #4a5a4a;
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
        }
        .unit-card .card-body {
            padding: 12px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .unit-card .card-body .unit-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #e8ecd8;
            margin-bottom: 4px;
        }
        .unit-card .card-body .unit-sub {
            font-size: 0.75rem;
            color: #7a8a6a;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .unit-card .card-body .unit-sub .tag {
            background: #2a3a2a;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #b8c8a8;
        }
        .unit-card .card-body .unit-desc {
            font-size: 0.82rem;
            color: #b8c8a8;
            line-height: 1.5;
            margin: 6px 0 10px;
            flex: 1;
        }
        .unit-card .card-body .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .unit-card .card-body .card-actions .btn-video {
            background: #2a3a2a;
            color: #c8d8b8;
            border: none;
            padding: 4px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .unit-card .card-body .card-actions .btn-video:hover {
            background: #4a6a3a;
            color: #fff;
        }
        .unit-card .card-body .card-actions .btn-video i {
            font-size: 0.9rem;
        }

        /* ===== 视频模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-overlay .modal-box {
            background: #141a14;
            border-radius: 16px;
            max-width: 860px;
            width: 100%;
            border: 1px solid #4a6a3a;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-overlay .modal-box .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 22px;
            background: #1a221a;
            border-bottom: 1px solid #2a3a2a;
        }
        .modal-overlay .modal-box .modal-header .modal-title {
            font-weight: 700;
            color: #f5e6b0;
            font-size: 1.1rem;
        }
        .modal-overlay .modal-box .modal-header .modal-close {
            background: none;
            border: none;
            color: #8a9a7a;
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
            transition: 0.2s;
            padding: 0 6px;
        }
        .modal-overlay .modal-box .modal-header .modal-close:hover {
            color: #ff6b6b;
            transform: rotate(90deg);
        }
        .modal-overlay .modal-box .modal-body {
            padding: 0;
        }
        .modal-overlay .modal-box .modal-body video {
            width: 100%;
            display: block;
            background: #0a0c0a;
            max-height: 70vh;
        }

        /* ===== 无结果 ===== */
        .no-result {
            text-align: center;
            padding: 50px 20px;
            color: #5a6a5a;
            font-size: 1.1rem;
        }
        .no-result i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .live-section .live-wrapper .live-iframe {
                height: 280px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .controls .control-group {
                justify-content: center;
            }
            .controls .stats {
                margin-left: 0;
                text-align: center;
            }
            .gift-group .gift-body {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
                padding: 14px 16px 18px;
            }
        }
        @media (max-width: 520px) {
            .live-section {
                padding: 12px 14px;
            }
            .live-section .live-wrapper .live-iframe {
                height: 200px;
            }
            .units-section {
                padding: 16px 14px 30px;
            }
            .controls .btn {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
            .gift-group .gift-header {
                padding: 10px 14px;
                gap: 6px;
            }
            .gift-group .gift-header .gift-name {
                font-size: 1rem;
            }
            .gift-group .gift-body {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                padding: 12px 12px 16px;
            }
            .unit-card .card-img {
                aspect-ratio: 16/12;
            }
        }
        .hidden { display: none !important; }
        .text-gold { color: #f5e6b0; }
        .text-muted { color: #7a8a6a; }
    </style>
</head>
<body>

    <!-- ===== 顶部标题（含头像） ===== -->
    <header class="page-header">
        <div class="header-left">
            <img src="头像.jpg" alt="头像" class="avatar" />
            <div class="title-group">
                <h1>
                    🎖️ B站巴顿英雄连2弹幕游戏
                    <small>｜COH2 弹幕互动</small>
                </h1>
                <div class="sub-tag">⚔️ 盟军 · 帝国 ｜ 步兵 · 装甲 · 远程 ｜ 礼物召唤单位</div>
            </div>
        </div>
    </header>

    <!-- ===== 直播间 ===== -->
    <section class="live-section">
        <div class="live-wrapper">
            <div class="live-header">
                <div class="live-title">
                    <i>●</i> 正在直播 · 巴顿英雄连2弹幕游戏
                </div>
                <a class="goto-btn" href="https://live.bilibili.com/1987060053" target="_blank">
                    ▶ 前往直播间
                </a>
            </div>
            <div class="live-iframe" id="liveIframeContainer">
                <iframe
                src="https://live.bilibili.com/1987060053"
                allowfullscreen
                loading="lazy"
                title="B站直播间"
                ></iframe>
            </div>
            <div class="live-fallback" id="liveFallback">
                <p style="margin-bottom:16px;">⚠️ 若直播无法加载，请点击下方按钮直接跳转</p>
                <a href="https://live.bilibili.com/1987060053" target="_blank">🔴 前往 B站直播间</a>
            </div>
        </div>
    </section>

    <!-- ===== 单位展示区 ===== -->
    <section class="units-section" id="app">
        <div class="controls">
            <div class="control-group">
                <span class="label">⚔️ 阵营</span>
                <button class="btn btn-faction active" data-faction="all">全部</button>
                <button class="btn btn-faction" data-faction="盟军">盟军</button>
                <button class="btn btn-faction" data-faction="帝国">帝国</button>
            </div>
            <div class="control-group">
                <span class="label">🏷️ 标签</span>
                <button class="btn btn-tag active" data-tag="all">全部</button>
                <button class="btn btn-tag" data-tag="步兵">步兵</button>
                <button class="btn btn-tag" data-tag="装甲">装甲</button>
                <button class="btn btn-tag" data-tag="远程">远程</button>
            </div>
            <div class="stats">
                单位 <span id="unitCount">0</span> 个
            </div>
        </div>
        <div id="unitList"></div>
    </section>

    <!-- ===== 视频模态框 ===== -->
    <div class="modal-overlay" id="videoModal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalVideoTitle">🎬 单位演示</span>
                <button class="modal-close" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <video id="modalVideo" controls autoplay muted>
                    <source src="" type="video/mp4" />
                    您的浏览器不支持视频播放。
                </video>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  全局变量（由数据文件填充）
        // ================================================================
        let allUnits = [];
        let giftConfig = {};
        let currentFaction = 'all';
        let currentTag = 'all';

        const container = document.getElementById('unitList');
        const unitCountEl = document.getElementById('unitCount');

        // ================================================================
        //  工具函数（依赖外部数据）
        // ================================================================
        function getImagePath(faction, unitName) {
            // 航空编队使用 .jpg，其余使用 .png
            const ext = (unitName === '航空编队') ? 'jpg' : 'png';
            return faction + '/' + unitName + '.' + ext;
        }

        function getVideoPath() {
            return '视频/测试.mp4';
        }

        function getGiftInfo(faction, category) {
            return giftConfig[faction]?.[category] || null;
        }

        // ================================================================
        //  渲染引擎
        // ================================================================
        function filterUnits(units, faction, tag) {
            return units.filter(u => {
                if (faction !== 'all' && u.faction !== faction) return false;
                if (tag !== 'all' && u.tag !== tag) return false;
                return true;
            });
        }

        function groupByGift(units) {
            const groups = {};
            for (const u of units) {
                const key = u.faction + '|' + u.category;
                if (!groups[key]) {
                    groups[key] = {
                        faction: u.faction,
                        category: u.category,
                        gift: getGiftInfo(u.faction, u.category),
                        units: []
                    };
                }
                groups[key].units.push(u);
            }
            return Object.values(groups);
        }

        function render() {
            const filtered = filterUnits(allUnits, currentFaction, currentTag);
            const grouped = groupByGift(filtered);

            if (grouped.length === 0) {
                container.innerHTML = `
                    <div class="no-result">
                        <i>🔍</i>
                        没有找到匹配的单位<br>
                        <span class="text-muted" style="font-size:0.9rem;">尝试调整筛选条件</span>
                    </div>
                `;
                unitCountEl.textContent = '0';
                return;
            }

            let html = '';
            let totalUnits = 0;

            grouped.sort((a, b) => {
                if (a.faction === b.faction) return a.category.localeCompare(b.category);
                return a.faction === '盟军' ? -1 : 1;
            });

            const iconMap = {
                '步兵': '🔫',
                '装甲车': '🚗',
                '步兵杀手': '💥',
                '坦克': '🔧',
                '超级坦克': '⭐',
                '管风琴': '🎵',
                '喀秋莎': '🚀',
                '斯图卡': '✈️',
                '灰熊': '🐻',
                '榴弹炮': '💣',
                '航空编队': '🛩️',
            };

            for (const group of grouped) {
                const { faction, category, gift, units } = group;
                totalUnits += units.length;

                const giftLabel = gift ? `${gift.label} ${gift.battery}电池 ${gift.count}` : category;
                const icon = iconMap[category] || '🎯';

                html += `
                    <div class="gift-group" data-faction="${faction}" data-category="${category}">
                        <div class="gift-header" onclick="toggleGift(this)">
                            <span class="gift-icon">${icon}</span>
                            <span class="gift-name">${faction} · ${category}</span>
                            <span class="gift-battery">⚡ ${gift ? gift.label : ''} ${gift ? gift.battery : ''}电池</span>
                            <span class="gift-count">${units.length} 个单位</span>
                            <span class="gift-arrow open">▼</span>
                        </div>
                        <div class="gift-body" id="giftBody-${faction}-${category}">
                `;

                for (const u of units) {
                    const imgPath = getImagePath(u.faction, u.unitName);
                    html += `
                        <div class="unit-card" data-unit="${u.unitName}">
                            <div class="card-img">
                                <img src="${imgPath}" alt="${u.unitName}" loading="lazy"
                                     onerror="this.onerror=null; this.classList.add('load-error'); this.parentElement.querySelector('.img-placeholder').style.display='block';">
                                <div class="img-placeholder" style="display:none;">🖼️ ${u.unitName}</div>
                            </div>
                            <div class="card-body">
                                <div class="unit-name">${u.unitName}</div>
                                <div class="unit-sub">
                                    <span class="tag">${u.tag}</span>
                                    <span>${u.faction}</span>
                                    ${gift ? `<span style="color:#b8a87a;">${gift.label} ${gift.battery}⚡</span>` : ''}
                                </div>
                                <div class="unit-desc">${u.intro}</div>
                                <div class="card-actions">
                                    <button class="btn-video" onclick="playVideo('${u.unitName}')">
                                        ▶ 演示视频
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            unitCountEl.textContent = totalUnits;
        }

        // ================================================================
        //  交互控制
        // ================================================================
        window.toggleGift = function(header) {
            const body = header.nextElementSibling;
            const arrow = header.querySelector('.gift-arrow');
            if (body) {
                body.classList.toggle('collapsed');
                if (arrow) arrow.classList.toggle('open');
            }
        };

        window.playVideo = function(unitName) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            const title = document.getElementById('modalVideoTitle');
            title.textContent = `🎬 ${unitName} · 单位演示`;
            video.src = getVideoPath();
            video.load();
            modal.classList.add('open');
            video.play().catch(() => {});
        };

        // 模态框关闭
        document.getElementById('modalCloseBtn').addEventListener('click', function() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            modal.classList.remove('open');
            video.pause();
            video.src = '';
        });
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                const video = document.getElementById('modalVideo');
                this.classList.remove('open');
                video.pause();
                video.src = '';
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('videoModal');
                if (modal.classList.contains('open')) {
                    const video = document.getElementById('modalVideo');
                    modal.classList.remove('open');
                    video.pause();
                    video.src = '';
                }
            }
        });

        // 绑定筛选按钮
        function bindControls() {
            document.querySelectorAll('.btn-faction').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.btn-faction').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFaction = this.dataset.faction;
                    render();
                });
            });
            document.querySelectorAll('.btn-tag').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.btn-tag').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentTag = this.dataset.tag;
                    render();
                });
            });
        }

        // ================================================================
        //  加载数据文件并启动
        // ================================================================
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('无法加载 data.json');
                const data = await response.json();

                // 验证数据结构
                if (!data.units || !data.giftConfig) {
                    throw new Error('data.json 缺少 units 或 giftConfig 字段');
                }

                // 填充全局变量
                allUnits = data.units;
                giftConfig = data.giftConfig;

                // 绑定控制事件
                bindControls();

                // 初次渲染
                render();

                // 直播间降级检测
                checkLiveIframe();

                console.log('✅ 数据加载成功，单位数:', allUnits.length);
            } catch (err) {
                console.error('❌ 加载数据失败:', err);
                container.innerHTML = `
                    <div class="no-result" style="color:#ff6b6b;">
                        <i>⚠️</i>
                        数据加载失败，请检查 data.json 文件是否存在且格式正确。<br>
                        <span class="text-muted">${err.message}</span>
                    </div>
                `;
            }
        }

        // 直播间 iframe 降级
        function checkLiveIframe() {
            const container = document.getElementById('liveIframeContainer');
            const fallback = document.getElementById('liveFallback');
            setTimeout(() => {
                const iframe = container.querySelector('iframe');
                if (iframe) {
                    let loaded = false;
                    iframe.onload = function() { loaded = true; };
                    setTimeout(() => {
                        if (!loaded) {
                            container.style.display = 'none';
                            fallback.style.display = 'block';
                        }
                    }, 3000);
                }
            }, 2000);
        }

        // 启动
        loadData();
    </script>

</body>
</html>
