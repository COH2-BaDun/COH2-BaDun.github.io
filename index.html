<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>B站视频轮播 · 结束切换</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            overflow: hidden;
        }

        .live-card {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
        }

        .live-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #00a1d6;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 14px 4px 10px;
            border-radius: 100px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .live-badge::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            animation: pulse-dot 1.4s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        .live-title {
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .live-title .video-id {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .scale-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            overflow: hidden;
        }

        .iframe-base {
            width: 1000px;
            height: 562.5px;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            flex-shrink: 0;
        }

        .iframe-base iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0c10;
            border-radius: 16px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .live-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            flex-wrap: wrap;
            gap: 6px 12px;
            flex-shrink: 0;
        }

        .live-footer .hint {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-footer .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-footer .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        .live-footer .carousel-info {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            .live-card {
                padding: 14px;
                border-radius: 18px;
            }
            .live-title {
                font-size: 15px;
            }
            .live-title .video-id {
                font-size: 12px;
                padding: 1px 8px;
            }
            .live-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }
        @media (max-width: 400px) {
            .live-card {
                padding: 10px;
                border-radius: 14px;
            }
            .live-badge {
                font-size: 11px;
                padding: 3px 10px 3px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="live-card">
        <div class="live-header">
            <span class="live-badge">轮播</span>
            <span class="live-title">
                Bilibili 精选
                <span class="video-id" id="currentVideoLabel">BV1gEu66REHQ</span>
            </span>
        </div>

        <div class="scale-wrapper" id="scaleWrapper">
            <div class="iframe-base" id="iframeBase">
                <iframe id="videoIframe"
                src=""
                frameborder="0"
                scrolling="no"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <div class="live-footer">
        <span class="hint">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
            </svg>
            全屏 · 沉浸
        </span>
        <span class="status">
            <span class="dot"></span>
            高清 · 轮播
            <span class="carousel-info" id="carouselStatus">播放中</span>
        </span>
    </div>
</div>

<script>
    (function() {
        // ----- 视频列表（BVID） -----
        const videoList = [
            'BV1gEu66REHQ',
            'BV1czg56uEqc'
        ];
        let currentIndex = 0;
        const iframe = document.getElementById('videoIframe');
        const label = document.getElementById('currentVideoLabel');
        const statusSpan = document.getElementById('carouselStatus');

        // 构建播放器 URL（自动播放、静音、启用 postMessage、强制最高画质 quality=80 代表 4K，无则降级）
        function buildPlayerUrl(bvid) {
            return `https://player.bilibili.com/player.html?bvid=${bvid}&page=1&high_quality=1&autoplay=1&muted=1&enablePlayerPostMessage=1&quality=80`;
        }

        // 切换到指定索引的视频
        function switchVideo(index) {
            const bvid = videoList[index];
            iframe.src = buildPlayerUrl(bvid);
            label.textContent = bvid;
            statusSpan.textContent = '加载中...';
        }

        // 监听播放器消息（包括 ended 事件）
        window.addEventListener('message', function(event) {
            // 确保消息来自我们的 iframe
            if (event.source !== iframe.contentWindow) return;

            try {
                let data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                let eventType = null;

                // 处理两种常见格式
                if (data.event === 'ended') {
                    eventType = 'ended';
                } else if (data.event === 'player' && data.data && data.data.event === 'ended') {
                    eventType = 'ended';
                }

                if (eventType === 'ended') {
                    // 视频播放结束，切换到下一个
                    currentIndex = (currentIndex + 1) % videoList.length;
                    switchVideo(currentIndex);
                    statusSpan.textContent = '已切换';
                } else if (data.event === 'player' && data.data && data.data.event === 'ready') {
                    statusSpan.textContent = '播放中';
                }
            } catch (e) {
                // 忽略解析错误
            }
        });

        // 初始化加载第一个视频
        switchVideo(currentIndex);

        // 由于可能由于某些原因无法收到 ended 事件，增加一个 fallback：定期检查视频是否播放结束
        // 但B站播放器无法直接通过 JS 获取进度，我们可以通过监听 iframe 的 title 变化或其他方式，但不稳定。
        // 因此，我们主要依赖 postMessage，同时为了保险，设置一个定时器，如果长时间未收到消息，可能网络问题，
        // 但为了不重复切换，我们不做强制 fallback，因为用户反馈的是没实现，很可能 postMessage 未启用，
        // 我们已经添加了 enablePlayerPostMessage=1，应该能正常工作。

        // ----- 缩放适配 -----
        const base = document.getElementById('iframeBase');
        const wrapper = document.getElementById('scaleWrapper');
        const BASE_WIDTH = 1000;
        const BASE_HEIGHT = 562.5;

        function applyScale() {
            const card = document.querySelector('.live-card');
            const header = document.querySelector('.live-header');
            const footer = document.querySelector('.live-footer');
            const cardRect = card.getBoundingClientRect();
            const headerHeight = header.offsetHeight + 16;
            const footerHeight = footer.offsetHeight + 16;
            const padding = 20 * 2;
            const availableWidth = wrapper.clientWidth;
            const availableHeight = window.innerHeight - cardRect.top - padding - headerHeight - footerHeight;

            const scaleX = availableWidth / BASE_WIDTH;
            const scaleY = availableHeight / BASE_HEIGHT;
            let scale = Math.min(scaleX, scaleY);
            scale = Math.max(scale, 0.1);
            scale = Math.min(scale, 1);

            base.style.transform = `scale(${scale})`;
            const scaledHeight = BASE_HEIGHT * scale;
            wrapper.style.height = scaledHeight + 'px';
        }

        applyScale();

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(applyScale, 50);
        });

        if (window.ResizeObserver) {
            const ro = new ResizeObserver(function() {
                applyScale();
            });
            ro.observe(document.querySelector('.live-card'));
        }
    })();
</script>
</body>
</html>
