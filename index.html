<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>巴顿弹幕英雄连2</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            height: 100vh;
            overflow: hidden;
        }
        img {
            display: block;
            max-width: 100%;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #0b0e14;
        }
        .sidebar {
            flex: 0 0 56px;
            min-width: 56px;
            background: #111a24;
            border-right: 1px solid #1f2b38;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .faction-btn {
            flex: 1;
            border-radius: 0;
            background: #111a24;
            border-bottom: 1px solid #1a2532;
            color: #8a9eb0;
            font-weight: 600;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: 0.15s;
            min-height: 40px;
        }
        .faction-btn:last-child {
            border-bottom: none;
        }
        .faction-btn .icon {
            font-size: 18px;
        }
        .faction-btn[data-faction="盟军"] .icon {
            color: #e04848;
        }
        .faction-btn[data-faction="帝国"] .icon {
            color: #c0a060;
        }
        .faction-btn .label {
            font-size: 10px;
            opacity: 0.7;
        }
        .faction-btn:hover {
            background: #1a2532;
            color: #c8d6e5;
        }
        .faction-btn.active {
            background: #1f2b3a;
            border-left: 3px solid #e8b84a;
            color: #fff;
        }
        .faction-btn.active .label {
            color: #f5d77b;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0f1822;
        }
        .gift-nav {
            flex: 0 0 auto;
            background: #111a24;
            border-bottom: 1px solid #1f2b38;
            padding: 4px 0;
            display: flex;
            align-items: stretch;
            min-height: 44px;
        }
        .gift-btn {
            flex: 1;
            padding: 6px 4px;
            border-radius: 0;
            background: transparent;
            color: #6a7f98;
            font-size: 13px;
            font-weight: 500;
            border-right: 1px solid #1a2532;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .gift-btn:last-child {
            border-right: none;
        }
        .gift-btn .gift-icon-small {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
            background: #0d141d;
            border: 1px solid #2a3a4e;
            flex-shrink: 0;
        }
        .gift-btn:hover:not(.active) {
            background: #1a2532;
            color: #b0c8dd;
        }
        .gift-btn.active {
            background: #1f2b3a;
            color: #fff;
            border-bottom: 2px solid #e8b84a;
            font-weight: 600;
        }
        .gift-btn.invisible {
            opacity: 0;
            pointer-events: none;
            border-right-color: transparent;
        }
        .gift-desc-wrapper {
            flex: 0 0 auto;
            background: #111a24;
            border-bottom: 1px solid #1f2b38;
            padding: 6px 16px;
            overflow: hidden;
            white-space: nowrap;
            min-height: 34px;
            display: flex;
            align-items: center;
        }
        .gift-desc-scroll {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
            font-size: 18px;
            color: #b0c8dd;
            font-weight: 400;
        }
        .gift-desc-scroll.no-scroll {
            animation: none;
            padding-left: 0;
            display: block;
            text-align: center;
        }
        @keyframes marquee {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        .unit-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #0b111a;
            overflow: hidden;
        }
        .media-container {
            flex: 1;
            display: flex;
            min-height: 0;
            background: #070c14;
            position: relative;
        }
        .unit-title-overlay {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .unit-title-overlay .unit-seq {
            font-weight: 400;
            opacity: 0.7;
            margin-left: 8px;
            font-size: 0.8em;
        }
        .unit-slider {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #070c14;
            min-width: 0;
        }
        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.4s ease;
        }
        .slider-track .slide {
            flex: 0 0 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #070c14;
            position: relative;
        }
        .slider-track .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #070c14;
        }
        .slider-track .slide .fallback-text {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5a6e;
            font-size: 48px;
            background: #0d141d;
            font-weight: 300;
        }
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }
        .media-container:hover .slider-arrow {
            opacity: 0.7;
            pointer-events: auto;
        }
        .slider-arrow:hover {
            opacity: 1 !important;
            background: rgba(232, 184, 74, 0.25);
            border-color: #e8b84a;
        }
        .slider-arrow.hidden {
            display: none;
        }
        .slider-arrow.left {
            left: 8px;
        }
        .slider-arrow.right {
            right: 8px;
        }
        .slider-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .slider-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            transition: 0.2s;
            cursor: pointer;
            padding: 0;
        }
        .slider-dots .dot.active {
            background: #f5d77b;
            transform: scale(1.25);
            box-shadow: 0 0 12px rgba(232, 184, 74, 0.3);
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #070c14;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        .video-container .no-video {
            color: #4a5a6e;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
        .unit-info {
            flex: 0 0 auto;
            background: #111a24;
            border-top: 1px solid #1f2b38;
            padding: 8px 16px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            overflow: hidden;
        }
        .unit-desc-wrapper {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }
        .unit-desc-scroll {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
            font-size: 20px;
            color: #c6d4e3;
            font-weight: 500;
        }
        .unit-desc-scroll.no-scroll {
            animation: none;
            padding-left: 0;
            display: block;
            text-align: center;
        }
        .unit-info .unit-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .unit-info .unit-nav .nav-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #1a2532;
            border: 1px solid #2a3a4e;
            color: #b0c8dd;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .unit-info .unit-nav .nav-btn:hover {
            background: #2a3a4e;
            border-color: #4a6a8a;
            color: #fff;
        }
        .unit-info .unit-nav .nav-btn.disabled {
            opacity: 0.2;
            pointer-events: none;
        }
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4a5a6e;
            font-size: 15px;
            gap: 6px;
            padding: 30px;
            text-align: center;
        }
        .empty-state .big-icon {
            font-size: 42px;
            opacity: 0.3;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 640px) {
            .media-container {
                flex-direction: column;
            }
            .unit-slider,
            .video-container {
                flex: 1;
                min-height: 0;
            }
            .unit-title-overlay {
                font-size: 16px;
                padding: 4px 14px;
                top: 8px;
            }
            .unit-desc-scroll {
                font-size: 17px;
                animation-duration: 10s;
            }
            .gift-desc-scroll {
                font-size: 15px;
                animation-duration: 10s;
            }
            .sidebar {
                flex: 0 0 48px;
                min-width: 48px;
            }
            .faction-btn {
                font-size: 10px;
                min-height: 32px;
            }
            .faction-btn .icon {
                font-size: 15px;
            }
            .faction-btn .label {
                font-size: 8px;
            }
            .gift-nav {
                min-height: 36px;
                padding: 2px 0;
            }
            .gift-btn {
                font-size: 11px;
                padding: 4px 2px;
            }
            .gift-btn .gift-icon-small {
                width: 14px;
                height: 14px;
            }
            .gift-desc-wrapper {
                padding: 4px 10px;
                min-height: 28px;
            }
            .unit-info {
                padding: 6px 10px 8px;
                min-height: 40px;
                gap: 8px;
            }
            .slider-arrow {
                width: 28px;
                height: 28px;
                font-size: 16px;
                opacity: 0.5;
                pointer-events: auto;
            }
            .slider-arrow.left {
                left: 4px;
            }
            .slider-arrow.right {
                right: 4px;
            }
            .slider-dots {
                bottom: 8px;
                padding: 4px 8px;
                gap: 5px;
            }
            .slider-dots .dot {
                width: 6px;
                height: 6px;
            }
            .unit-info .unit-nav .nav-btn {
                width: 26px;
                height: 26px;
                font-size: 12px;
            }
        }
        @media (max-width: 400px) {
            .unit-desc-scroll {
                font-size: 15px;
                animation-duration: 8s;
            }
            .gift-desc-scroll {
                font-size: 13px;
                animation-duration: 8s;
            }
            .unit-title-overlay {
                font-size: 14px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <button class="faction-btn active" data-faction="盟军">
                <span class="icon">☭</span>
                <span class="label">盟军</span>
            </button>
            <button class="faction-btn" data-faction="帝国">
                <span class="icon">✙</span>
                <span class="label">帝国</span>
            </button>
        </aside>

        <main class="main">
            <nav class="gift-nav" id="giftNav">
                <span style="color:#4a5a6e;font-size:13px;flex:1;text-align:center;">加载数据...</span>
            </nav>
            <div class="gift-desc-wrapper hidden" id="giftDescWrapper">
                <span class="gift-desc-scroll" id="giftDesc">礼物描述</span>
            </div>

            <section class="unit-display" id="unitDisplay">
                <div class="empty-state" id="emptyState">
                    <div class="big-icon">📭</div>
                    <div>暂无数据</div>
                    <div style="font-size:12px;color:#3a4a5a;">请检查 data.js 是否存在</div>
                </div>
                <div class="media-container hidden" id="mediaContainer">
                    <div class="unit-title-overlay" id="unitTitle">
                        <span id="unitNameTitle">未命名</span>
                        <span class="unit-seq" id="unitSeq">1/1</span>
                    </div>
                    <div class="unit-slider" id="unitSlider">
                        <div class="slider-track" id="sliderTrack"></div>
                        <button class="slider-arrow left" id="sliderPrev">‹</button>
                        <button class="slider-arrow right" id="sliderNext">›</button>
                        <div class="slider-dots" id="sliderDots"></div>
                    </div>
                    <div class="video-container" id="videoContainer">
                        <video id="unitVideo" muted autoplay playsinline></video>
                        <div class="no-video hidden" id="noVideoMsg">📹 无视频</div>
                    </div>
                </div>
                <div class="unit-info hidden" id="unitInfo">
                    <div class="unit-desc-wrapper">
                        <span class="unit-desc-scroll" id="unitDesc">暂无描述</span>
                    </div>
                    <div class="unit-nav">
                        <button class="nav-btn" id="unitPrev">◀</button>
                        <button class="nav-btn" id="unitNext">▶</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="data.js"></script>
    <script>
        (function() {
            'use strict';

            if (typeof UNIT_DATA === 'undefined') {
                document.getElementById('giftNav').innerHTML =
                    `<span style="color:#e66767;font-size:13px;flex:1;text-align:center;">❌ data.js 未找到或格式错误</span>`;
                document.querySelector('.empty-state .big-icon').textContent = '⚠';
                document.querySelector('.empty-state div:nth-child(2)').textContent = '数据加载失败';
                document.querySelector('.empty-state div:nth-child(3)').textContent = '请确保 data.js 存在且定义了 UNIT_DATA';
                return;
            }

            const allData = UNIT_DATA;
            const FACTION_ORDER = ['盟军', '帝国'];
            let currentFaction = '盟军';
            let currentGiftKey = null;
            let currentGiftData = null;
            let currentGiftList = [];
            let currentGiftIndex = 0;
            let unitList = [];
            let unitIndexPos = 0;
            let imageList = [];
            let imageIndexPos = 0;

            let unitTimer = null;
            let imageTimer = null;
            let isAutoPaused = false;
            let pauseTimeout = null;
            const PAUSE_RESUME_DELAY = 5000;

            const $ = id => document.getElementById(id);
            const giftNav = $('giftNav'),
                sidebar = $('sidebar'),
                emptyState = $('emptyState');
            const giftDescWrapper = $('giftDescWrapper'),
                giftDesc = $('giftDesc');
            const mediaContainer = $('mediaContainer');
            const unitSlider = $('unitSlider'),
                sliderTrack = $('sliderTrack'),
                sliderDots = $('sliderDots'),
                sliderPrev = $('sliderPrev'),
                sliderNext = $('sliderNext');
            const videoContainer = $('videoContainer'),
                unitVideo = $('unitVideo'),
                noVideoMsg = $('noVideoMsg');
            const unitInfo = $('unitInfo'),
                unitDesc = $('unitDesc'),
                unitPrev = $('unitPrev'),
                unitNext = $('unitNext');
            const unitNameTitle = $('unitNameTitle'),
                unitSeq = $('unitSeq');

            // ---- 工具函数 ----
            function getGifts(faction) {
                const fd = allData[faction];
                if (!fd) return [];
                const result = [];
                for (const cat of ['步兵', '装甲', '远程']) {
                    const catData = fd[cat];
                    if (!catData) continue;
                    for (const [name, info] of Object.entries(catData)) {
                        if (info.units && info.units.length) {
                            result.push({ key: name, ...info });
                        }
                    }
                }
                return result;
            }

            function getUnitImages(unit, faction) {
                if (unit.images && unit.images.length) return unit.images.map(n => faction + '/' + n);
                if (unit.thumbnail && unit.thumbnail.length) return unit.thumbnail.map(n => faction + '/' + n);
                return [];
            }

            // ---- 预加载 ----
            function preloadUnitResources(unit, faction) {
                const images = getUnitImages(unit, faction);
                images.forEach(src => {
                    const img = new Image();
                    img.src = src;
                });
                if (unit.video) {
                    const videoPath = `视频/${unit.video}`;
                    const vid = document.createElement('video');
                    vid.preload = 'metadata';
                    vid.src = videoPath;
                    vid.load();
                }
            }

            function preloadGiftUnits(giftData, faction) {
                if (!giftData || !giftData.units) return;
                giftData.units.forEach(unit => {
                    preloadUnitResources(unit, faction);
                });
            }

            // ---- 更新礼物描述 ----
            function updateGiftDesc(giftData) {
                const desc = giftData?.description || '暂无描述';
                giftDesc.textContent = desc;
                giftDescWrapper.classList.remove('hidden');
                requestAnimationFrame(() => {
                    const wrapper = giftDesc.parentElement;
                    const scrollWidth = giftDesc.scrollWidth;
                    const clientWidth = wrapper.clientWidth;
                    if (scrollWidth > clientWidth) {
                        giftDesc.classList.remove('no-scroll');
                        giftDesc.style.animation = 'none';
                        void giftDesc.offsetHeight;
                        giftDesc.style.animation = '';
                    } else {
                        giftDesc.classList.add('no-scroll');
                    }
                });
            }

            // ---- 更新侧栏高亮 ----
            function updateSidebar(faction) {
                sidebar.querySelectorAll('.faction-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.faction === faction);
                });
            }

            // ---- 渲染礼物导航 ----
            function renderGiftNav(faction) {
                const gifts = getGifts(faction);
                currentGiftList = gifts;
                if (!gifts.length) {
                    giftNav.innerHTML =
                        `<span style="color:#4a5a6e;font-size:13px;flex:1;text-align:center;">该阵营暂无礼物</span>`;
                    giftDescWrapper.classList.add('hidden');
                    return;
                }
                let idx = gifts.findIndex(g => g.key === currentGiftKey);
                if (idx === -1) idx = 0;
                currentGiftKey = gifts[idx].key;
                currentGiftData = gifts[idx];
                currentGiftIndex = idx;

                updateGiftDesc(currentGiftData);
                preloadGiftUnits(currentGiftData, faction);

                const prev = gifts[idx - 1] || null,
                    next = gifts[idx + 1] || null;
                const buildBtn = (gift, cls) => {
                    if (!gift) return `<button class="gift-btn invisible" disabled></button>`;
                    const iconSrc = gift.image ? `礼物/${gift.image}` : '';
                    return `
                        <button class="gift-btn ${cls}" data-gift="${gift.key}">
                            ${iconSrc ? `<img class="gift-icon-small" src="${iconSrc}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                            ${gift.key}
                        </button>
                    `;
                };
                const html = `
                    ${buildBtn(prev, '')}
                    ${buildBtn(gifts[idx], 'active')}
                    ${buildBtn(next, '')}
                `;
                giftNav.innerHTML = html;

                giftNav.querySelectorAll('.gift-btn:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const key = this.dataset.gift;
                        if (key && key !== currentGiftKey) {
                            const gd = gifts.find(g => g.key === key);
                            if (gd) {
                                currentGiftKey = key;
                                currentGiftData = gd;
                                updateGiftDesc(gd);
                                preloadGiftUnits(gd, faction);
                                stopUnitCycle();
                                renderGiftNav(faction);
                                pauseAuto('gift');
                            }
                        }
                    });
                });

                if (currentGiftData) renderUnitDisplay(faction, currentGiftData);
                else {
                    const first = gifts[0];
                    currentGiftKey = first.key;
                    currentGiftData = first;
                    renderGiftNav(faction);
                }
            }

            // ---- 渲染单位展示 ----
            function renderUnitDisplay(faction, giftData) {
                const units = giftData?.units || [];
                unitList = units;
                unitIndexPos = 0;
                if (!unitList.length) {
                    emptyState.classList.remove('hidden');
                    mediaContainer.classList.add('hidden');
                    unitInfo.classList.add('hidden');
                    return;
                }
                emptyState.classList.add('hidden');
                mediaContainer.classList.remove('hidden');
                unitInfo.classList.remove('hidden');
                showUnit(0, faction);
            }

            // ---- 显示指定单位 ----
            function showUnit(index, faction) {
                if (!unitList.length) return;
                const idx = Math.max(0, Math.min(index, unitList.length - 1));
                unitIndexPos = idx;
                const unit = unitList[idx];

                unitNameTitle.textContent = unit.name || '未命名';
                unitSeq.textContent = `${idx + 1} / ${unitList.length}`;

                const descText = unit.description || '暂无描述';
                unitDesc.textContent = descText;
                requestAnimationFrame(() => {
                    const wrapper = unitDesc.parentElement;
                    const scrollWidth = unitDesc.scrollWidth;
                    const clientWidth = wrapper.clientWidth;
                    if (scrollWidth > clientWidth) {
                        unitDesc.classList.remove('no-scroll');
                        unitDesc.style.animation = 'none';
                        void unitDesc.offsetHeight;
                        unitDesc.style.animation = '';
                    } else {
                        unitDesc.classList.add('no-scroll');
                    }
                });

                const images = getUnitImages(unit, faction);
                imageList = images;
                imageIndexPos = 0;

                if (!imageList.length) {
                    sliderTrack.innerHTML = `
                        <div class="slide">
                            <div class="fallback-text">📷 无图</div>
                        </div>
                    `;
                    sliderDots.innerHTML = '';
                    sliderPrev.classList.add('hidden');
                    sliderNext.classList.add('hidden');
                } else {
                    let slides = '';
                    for (const src of imageList) {
                        const fallback = (unit.name && unit.name.length) ? unit.name.charAt(0) : '?';
                        slides += `
                            <div class="slide">
                                <img src="${src}" alt="${unit.name}" loading="lazy" 
                                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                                <div class="fallback-text" style="display:none;">${fallback}</div>
                            </div>
                        `;
                    }
                    sliderTrack.innerHTML = slides;
                    updateSliderPosition(0);
                    let dots = '';
                    for (let i = 0; i < imageList.length; i++) {
                        dots += `<button class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`;
                    }
                    sliderDots.innerHTML = dots;
                    sliderDots.querySelectorAll('.dot').forEach(d => {
                        d.addEventListener('click', function() {
                            const idx = parseInt(this.dataset.index, 10);
                            if (!isNaN(idx) && idx !== imageIndexPos) {
                                goToImage(idx);
                                pauseAuto('dot');
                            }
                        });
                    });
                    const multi = imageList.length > 1;
                    sliderPrev.classList.toggle('hidden', !multi);
                    sliderNext.classList.toggle('hidden', !multi);
                }

                if (unit.video) {
                    const videoPath = `视频/${unit.video}`;
                    unitVideo.src = videoPath;
                    unitVideo.load();
                    noVideoMsg.classList.add('hidden');
                    unitVideo.classList.remove('hidden');
                    unitVideo.onloadedmetadata = () => {
                        startUnitCycle(unit, faction);
                    };
                    unitVideo.onerror = () => {
                        console.warn('视频加载失败，使用默认时长8秒');
                        startUnitCycle(unit, faction, 8);
                    };
                } else {
                    unitVideo.classList.add('hidden');
                    noVideoMsg.classList.remove('hidden');
                    startUnitCycle(unit, faction, 8);
                }

                unitPrev.classList.toggle('disabled', idx === 0);
                unitNext.classList.toggle('disabled', idx === unitList.length - 1);
            }

            // ---- 周期控制 ----
            function startUnitCycle(unit, faction, fallbackDuration) {
                stopUnitCycle();

                let duration = fallbackDuration || 8;
                if (unit.video && unitVideo.readyState >= 1 && unitVideo.duration) {
                    duration = unitVideo.duration;
                }
                duration = Math.max(duration, 1);

                const totalImages = imageList.length;
                if (totalImages === 0) {
                    unitTimer = setTimeout(() => {
                        if (!isAutoPaused) {
                            nextUnit(true);
                        }
                    }, duration * 1000);
                    return;
                }

                const interval = (duration * 1000) / totalImages;
                let imgIndex = 0;
                imageIndexPos = 0;
                updateSliderPosition(0);

                if (imageTimer) clearInterval(imageTimer);
                imageTimer = setInterval(() => {
                    if (isAutoPaused) return;
                    imgIndex = (imgIndex + 1) % totalImages;
                    imageIndexPos = imgIndex;
                    updateSliderPosition(imgIndex);
                }, interval);

                if (unitTimer) clearTimeout(unitTimer);
                unitTimer = setTimeout(() => {
                    if (!isAutoPaused) {
                        nextUnit(true);
                    }
                }, duration * 1000);

                if (unit.video) {
                    unitVideo.currentTime = 0;
                    unitVideo.play().catch(e => console.warn('视频自动播放被阻止', e));
                }
            }

            function stopUnitCycle() {
                if (unitTimer) { clearTimeout(unitTimer);
                    unitTimer = null; }
                if (imageTimer) { clearInterval(imageTimer);
                    imageTimer = null; }
                unitVideo.pause();
            }

            function updateSliderPosition(index) {
                const total = imageList.length;
                if (!total) return;
                const idx = ((index % total) + total) % total;
                imageIndexPos = idx;
                sliderTrack.style.transform = `translateX(${-idx * 100}%)`;
                sliderDots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
            }

            function goToImage(index) {
                if (imageList.length) {
                    updateSliderPosition(index);
                    pauseAuto('image');
                }
            }

            // ---- 跨阵营礼物切换核心逻辑 ----
            function nextGift() {
                if (!currentGiftList.length) return;
                if (currentGiftIndex === currentGiftList.length - 1) {
                    // 切换到下一个阵营
                    const curIdx = FACTION_ORDER.indexOf(currentFaction);
                    const nextIdx = (curIdx + 1) % FACTION_ORDER.length;
                    const newFaction = FACTION_ORDER[nextIdx];
                    const newGifts = getGifts(newFaction);
                    if (!newGifts.length) {
                        // 如果下一个阵营没有礼物，则停留在当前（理论上不会发生）
                        return;
                    }
                    currentFaction = newFaction;
                    updateSidebar(newFaction);
                    currentGiftKey = newGifts[0].key;
                    currentGiftData = newGifts[0];
                    currentGiftIndex = 0;
                    stopUnitCycle();
                    renderGiftNav(newFaction);
                } else {
                    const nextIdx = currentGiftIndex + 1;
                    const newGift = currentGiftList[nextIdx];
                    currentGiftKey = newGift.key;
                    currentGiftData = newGift;
                    currentGiftIndex = nextIdx;
                    updateGiftDesc(newGift);
                    preloadGiftUnits(newGift, currentFaction);
                    stopUnitCycle();
                    renderGiftNav(currentFaction);
                }
            }

            function prevGift() {
                if (!currentGiftList.length) return;
                if (currentGiftIndex === 0) {
                    // 切换到上一个阵营
                    const curIdx = FACTION_ORDER.indexOf(currentFaction);
                    const prevIdx = (curIdx - 1 + FACTION_ORDER.length) % FACTION_ORDER.length;
                    const newFaction = FACTION_ORDER[prevIdx];
                    const newGifts = getGifts(newFaction);
                    if (!newGifts.length) {
                        return;
                    }
                    const lastIdx = newGifts.length - 1;
                    currentFaction = newFaction;
                    updateSidebar(newFaction);
                    currentGiftKey = newGifts[lastIdx].key;
                    currentGiftData = newGifts[lastIdx];
                    currentGiftIndex = lastIdx;
                    stopUnitCycle();
                    renderGiftNav(newFaction);
                } else {
                    const prevIdx = currentGiftIndex - 1;
                    const newGift = currentGiftList[prevIdx];
                    currentGiftKey = newGift.key;
                    currentGiftData = newGift;
                    currentGiftIndex = prevIdx;
                    updateGiftDesc(newGift);
                    preloadGiftUnits(newGift, currentFaction);
                    stopUnitCycle();
                    renderGiftNav(currentFaction);
                }
            }

            // ---- 单位切换（自动/手动） ----
            function nextUnit(auto = false) {
                if (!unitList.length) return;
                if (unitIndexPos === unitList.length - 1) {
                    nextGift(); // 自动切换礼物，不暂停
                    if (!auto) pauseAuto('unit');
                } else {
                    const n = unitIndexPos + 1;
                    showUnit(n, currentFaction);
                    if (!auto) pauseAuto('unit');
                }
            }

            function prevUnit() {
                if (!unitList.length) return;
                if (unitIndexPos === 0) {
                    prevGift();
                    pauseAuto('unit');
                } else {
                    const n = unitIndexPos - 1;
                    showUnit(n, currentFaction);
                    pauseAuto('unit');
                }
            }

            // ---- 暂停/恢复 ----
            function pauseAuto(source) {
                if (!isAutoPaused) {
                    isAutoPaused = true;
                    unitVideo.pause();
                }
                if (pauseTimeout) clearTimeout(pauseTimeout);
                pauseTimeout = setTimeout(() => {
                    isAutoPaused = false;
                    pauseTimeout = null;
                    const unit = unitList[unitIndexPos];
                    if (unit) {
                        stopUnitCycle();
                        startUnitCycle(unit, currentFaction);
                    }
                }, PAUSE_RESUME_DELAY);
            }

            // ---- 切换阵营（手动点击侧栏） ----
            function switchFaction(faction) {
                if (faction === currentFaction) return;
                currentFaction = faction;
                updateSidebar(faction);
                stopUnitCycle();
                isAutoPaused = false;
                if (pauseTimeout) clearTimeout(pauseTimeout);
                currentGiftKey = null;
                currentGiftData = null;
                renderGiftNav(faction);
            }

            // ---- 事件绑定 ----
            sidebar.querySelectorAll('.faction-btn').forEach(btn => {
                btn.addEventListener('click', function() { switchFaction(this.dataset.faction); });
            });
            sliderPrev.addEventListener('click', function() {
                if (imageList.length) {
                    goToImage(imageIndexPos - 1);
                }
            });
            sliderNext.addEventListener('click', function() {
                if (imageList.length) {
                    goToImage(imageIndexPos + 1);
                }
            });
            unitPrev.addEventListener('click', function() { prevUnit(); });
            unitNext.addEventListener('click', function() { nextUnit(false); });

            // ---- 启动 ----
            renderGiftNav(currentFaction);
        })();
    </script>
</body>
</html>
