<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>巴顿英雄连2弹幕游戏</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            line-height: 1.5;
        }
        a {
            color: #58b9ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        img {
            display: block;
            max-width: 100%;
        }

        /* ===== 容器 ===== */
        .app {
            max-width: 1300px;
            margin: 0 auto;
            padding: 12px 16px 40px;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 18px;
            padding: 16px 0 12px;
            border-bottom: 1px solid #2a313c;
            margin-bottom: 18px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3d4a5a;
            flex-shrink: 0;
            background: #1e2630;
        }
        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f5d77b, #e8b84a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .header-right {
            margin-left: auto;
            font-size: 0.95rem;
            background: #1a222c;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #2e3a48;
            white-space: nowrap;
        }
        .header-right a {
            color: #7fc9ff;
            font-weight: 500;
        }
        .header-right a:hover {
            color: #b0dfff;
            text-decoration: none;
        }

        /* ===== 直播窗口 ===== */
        .live-section {
            margin-bottom: 28px;
            border-radius: 14px;
            overflow: hidden;
            background: #131b24;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #26313e;
            position: relative;
            aspect-ratio: 16 / 9;
            max-height: 75vh;
            width: 100%;
        }
        .live-section iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        @media (max-width: 640px) {
            .live-section {
                aspect-ratio: 16 / 9;
                max-height: 50vh;
                border-radius: 10px;
            }
            .site-title {
                font-size: 1.2rem;
            }
            .header-right {
                font-size: 0.8rem;
                padding: 4px 12px;
                white-space: normal;
            }
            .avatar {
                width: 40px;
                height: 40px;
            }
        }

        /* ===== 单位展示区 ===== */
        .units-section {
            margin-top: 10px;
        }

        /* 阵营选项卡 */
        .faction-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a313c;
            padding-bottom: 8px;
        }
        .faction-tab {
            padding: 8px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            background: transparent;
            border: none;
            color: #8a9eb0;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .faction-tab:hover {
            color: #d0ddee;
            background: #1a222c;
        }
        .faction-tab.active {
            color: #fff;
            background: #2a3a4e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .faction-tab .icon-soviet {
            color: #cc3333;
        }
        .faction-tab .icon-nazi {
            color: #b0b0b0;
        }

        /* 阵营内容容器 */
        .faction-content {
            display: none;
        }
        .faction-content.active {
            display: block;
        }

        /* 标签折叠 */
        .tag-group {
            margin-bottom: 20px;
            border: 1px solid #26313e;
            border-radius: 10px;
            overflow: hidden;
            background: #111a24;
        }
        .tag-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            font-size: 1.05rem;
            font-weight: 600;
            background: #1e2835;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
            border-bottom: 1px solid transparent;
            color: #c8d6e5;
            letter-spacing: 0.5px;
        }
        .tag-label:hover {
            background: #263340;
        }
        .tag-label .arrow {
            font-size: 0.8rem;
            transition: transform 0.25s;
            color: #7a8fa8;
        }
        .tag-group.collapsed .tag-label .arrow {
            transform: rotate(-90deg);
        }
        .tag-group.collapsed .gift-group-wrapper {
            display: none;
        }
        .gift-group-wrapper {
            padding: 12px 16px 16px;
        }

        /* 礼物分组 */
        .gift-group {
            background: #0f1822;
            border-radius: 10px;
            padding: 12px 14px 14px;
            margin-bottom: 14px;
            border: 1px solid #1f2b38;
            transition: border-color 0.2s;
        }
        .gift-group:last-child {
            margin-bottom: 0;
        }
        .gift-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #1f2b38;
        }
        .gift-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #4a5a6e;
            background: #1e2835;
            flex-shrink: 0;
        }
        .gift-name {
            font-weight: 600;
            font-size: 1.0rem;
            color: #f0e6c5;
        }
        .gift-value {
            background: #1f2b39;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #b8cbdf;
            border: 1px solid #324252;
        }
        .gift-count {
            color: #8ea9c7;
            font-size: 0.85rem;
            margin-left: auto;
        }

        /* 单位卡片网格 */
        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        @media (max-width: 480px) {
            .unit-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
        }

        /* 单个单位卡片 */
        .unit-card {
            background: #17212b;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            border: 1px solid #2b3848;
            display: flex;
            flex-direction: column;
        }
        .unit-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-color: #4d637f;
        }
        .unit-card-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #0d141d;
            border-bottom: 1px solid #25303e;
        }
        .unit-card-name {
            padding: 8px 10px 4px;
            font-weight: 600;
            font-size: 0.92rem;
            text-align: center;
            color: #dce4ef;
            background: #0f1822;
            letter-spacing: 0.3px;
        }
        .unit-card-meta {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 8px 8px;
            font-size: 0.7rem;
            color: #8ea5bf;
            background: #0f1822;
            border-top: 1px solid #1f2b38;
            flex-wrap: wrap;
        }
        .unit-card-meta span {
            background: #1c2837;
            padding: 1px 10px;
            border-radius: 30px;
            border: 1px solid #2e3d4f;
        }

        /* ===== 模态弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #16202b;
            border-radius: 18px;
            max-width: 720px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 20px 24px 28px;
            border: 1px solid #3b4c60;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: #2a3a4c;
            border: none;
            color: #e0e8f0;
            font-size: 1.6rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 10;
            margin-bottom: 6px;
        }
        .modal-close:hover {
            background: #3f556b;
            transform: rotate(90deg);
        }
        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 6px 0 12px;
            color: #f0e8d0;
        }
        .modal-carousel {
            position: relative;
            background: #0d141d;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
            aspect-ratio: 16 / 10;
        }
        .modal-carousel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a111a;
        }
        .carousel-nav {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .carousel-nav button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-nav button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .carousel-nav .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            cursor: pointer;
            padding: 0;
            transition: 0.2s;
            align-self: center;
        }
        .carousel-nav .dot.active {
            background: #ffd966;
            transform: scale(1.2);
        }

        .modal-description {
            font-size: 0.98rem;
            color: #c6d4e3;
            line-height: 1.7;
            background: #0f1924;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 10px 0 14px;
            border-left: 3px solid #e8b84a;
        }
        .modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            font-size: 0.88rem;
            color: #a6bacf;
            margin-bottom: 12px;
        }
        .modal-meta span {
            background: #1b2838;
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid #314252;
        }
        .modal-video {
            border-radius: 10px;
            overflow: hidden;
            background: #0a111a;
            margin-top: 6px;
        }
        .modal-video video {
            width: 100%;
            display: block;
            max-height: 50vh;
            background: #000;
        }

        /* ===== 加载 / 空状态 ===== */
        .loading-text {
            text-align: center;
            padding: 40px 0;
            color: #7a8fa8;
            font-size: 1.1rem;
        }

        /* ===== 滚动条 ===== */
        .modal-box::-webkit-scrollbar {
            width: 6px;
        }
        .modal-box::-webkit-scrollbar-track {
            background: #0f1822;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: #3a5068;
            border-radius: 10px;
        }

        /* ===== 实用 ===== */
        .text-muted {
            color: #7a8fa8;
            font-size: 0.85rem;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mb-1 {
            margin-bottom: 4px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- 头部 -->
        <header class="header">
            <div class="header-left">
                <img src="profile.jpg" alt="avatar" class="avatar" id="avatarImg">
                <span class="site-title">巴顿英雄连2弹幕游戏</span>
            </div>
            <div class="header-right">
                <a href="https://live.bilibili.com/1987060053" target="_blank" rel="noopener">
                    直播间 &gt;
                </a>
            </div>
        </header>

        <!-- 直播窗口 -->
        <div class="live-section">
            <iframe
            src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=1987060053"
            allowfullscreen
            loading="lazy"
            title="B站直播间"
            ></iframe>
        </div>

        <!-- 单位展示 -->
        <section class="units-section" id="unitsContainer">
            <div class="loading-text">加载单位数据...</div>
        </section>
    </div>

    <!-- ===== 模态弹窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-title" id="modalTitle">单位名称</div>
            <div class="modal-carousel" id="modalCarousel">
                <img id="modalCarouselImg" src="" alt="单位图片">
                <div class="carousel-nav" id="carouselNav"></div>
            </div>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-description" id="modalDesc">介绍文字</div>
            <div class="modal-video">
                <video id="modalVideo" controls preload="metadata" playsinline>
                    <source src="" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 加载 data.json
        // ============================================================
        let allData = null;
        let currentFaction = '盟军';

        async function loadData() {
            try {
                const resp = await fetch('data.json');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                allData = await resp.json();
                renderFactionTabs();
                renderFaction('盟军');
            } catch (err) {
                document.getElementById('unitsContainer').innerHTML =
                    `<div class="loading-text" style="color:#e66767;">数据加载失败：${err.message}</div>`;
                console.error(err);
            }
        }

        // ============================================================
        //  2. 渲染阵营选项卡
        // ============================================================
        function renderFactionTabs() {
            const container = document.getElementById('unitsContainer');
            // 清空，但保留加载状态
            container.innerHTML = '';

            // 创建选项卡容器
            const tabsDiv = document.createElement('div');
            tabsDiv.className = 'faction-tabs';

            const factions = ['盟军', '帝国'];
            const icons = {
                '盟军': '☭',
                '帝国': '⚡'
            };
            const iconClass = {
                '盟军': 'icon-soviet',
                '帝国': 'icon-nazi'
            };

            factions.forEach(f => {
                const btn = document.createElement('button');
                btn.className = 'faction-tab' + (f === currentFaction ? ' active' : '');
                btn.dataset.faction = f;
                btn.innerHTML = `<span class="${iconClass[f]}">${icons[f]}</span> ${f}`;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.faction-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFaction = f;
                    renderFaction(f);
                });
                tabsDiv.appendChild(btn);
            });

            container.appendChild(tabsDiv);

            // 创建两个阵营内容容器（用于切换）
            const contentWrapper = document.createElement('div');
            contentWrapper.id = 'factionContentWrapper';
            container.appendChild(contentWrapper);
        }

        // ============================================================
        //  3. 渲染指定阵营
        // ============================================================
        function renderFaction(faction) {
            const wrapper = document.getElementById('factionContentWrapper');
            wrapper.innerHTML = '';

            const factionData = allData[faction];
            if (!factionData) {
                wrapper.innerHTML = '<div class="loading-text">该阵营暂无数据</div>';
                return;
            }

            const tagOrder = ['步兵', '装甲', '远程'];
            const tagLabels = {
                '步兵': '步兵',
                '装甲': '装甲',
                '远程': '远程'
            };

            for (const tag of tagOrder) {
                const tagData = factionData[tag];
                if (!tagData || Object.keys(tagData).length === 0) continue;

                const tagGroup = document.createElement('div');
                tagGroup.className = 'tag-group';

                // 标签头（可折叠）
                const label = document.createElement('div');
                label.className = 'tag-label';
                label.innerHTML = `${tagLabels[tag]} <span class="arrow">▼</span>`;
                label.addEventListener('click', () => {
                    tagGroup.classList.toggle('collapsed');
                });
                tagGroup.appendChild(label);

                // 内容包裹
                const wrapperDiv = document.createElement('div');
                wrapperDiv.className = 'gift-group-wrapper';

                // 遍历礼物（按价值排序）
                const giftNames = Object.keys(tagData).sort((a, b) => {
                    return (tagData[a].value || 0) - (tagData[b].value || 0);
                });

                for (const giftName of giftNames) {
                    const gift = tagData[giftName];
                    if (!gift || !gift.units || gift.units.length === 0) continue;

                    const giftGroup = document.createElement('div');
                    giftGroup.className = 'gift-group';

                    // 礼物头部
                    const header = document.createElement('div');
                    header.className = 'gift-header';

                    const icon = document.createElement('img');
                    icon.className = 'gift-icon';
                    // 使用礼物路径：礼物/礼物名/礼物名.jpg
                    const giftImagePath = `礼物/${giftName}/${giftName}.jpg`;
                    icon.src = giftImagePath;
                    icon.alt = giftName;
                    icon.loading = 'lazy';
                    icon.onerror = function() { this.src = 'profile.jpg'; };

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'gift-name';
                    nameSpan.textContent = giftName;

                    const valueSpan = document.createElement('span');
                    valueSpan.className = 'gift-value';
                    valueSpan.textContent = `⚡ ${gift.value || 0} 电池`;

                    const countSpan = document.createElement('span');
                    countSpan.className = 'gift-count';
                    countSpan.textContent = `出场 ×${gift.count || 1}`;

                    header.append(icon, nameSpan, valueSpan, countSpan);
                    giftGroup.appendChild(header);

                    // 单位网格
                    const grid = document.createElement('div');
                    grid.className = 'unit-grid';

                    for (const unit of gift.units) {
                        const card = createUnitCard(unit, faction, giftName, gift.value, gift.count);
                        grid.appendChild(card);
                    }

                    giftGroup.appendChild(grid);
                    wrapperDiv.appendChild(giftGroup);
                }

                tagGroup.appendChild(wrapperDiv);
                wrapper.appendChild(tagGroup);
            }

            // 默认展开所有tag
            wrapper.querySelectorAll('.tag-group').forEach(g => g.classList.remove('collapsed'));
        }

        // ============================================================
        //  4. 创建单位卡片
        // ============================================================
        function createUnitCard(unit, faction, giftName, giftValue, giftCount) {
            const card = document.createElement('div');
            card.className = 'unit-card';

            const img = document.createElement('img');
            img.className = 'unit-card-img';
            const firstImg = unit.images && unit.images.length > 0 ? unit.images[0] : 'profile.jpg';
            img.src = faction + '/' + firstImg;
            img.alt = unit.name;
            img.loading = 'lazy';
            img.onerror = function() { this.src = 'profile.jpg'; };

            const nameDiv = document.createElement('div');
            nameDiv.className = 'unit-card-name';
            nameDiv.textContent = unit.name;

            const meta = document.createElement('div');
            meta.className = 'unit-card-meta';
            // 只显示价值和出场数量
            const valSpan = document.createElement('span');
            valSpan.textContent = `⚡ ${giftValue || 0}`;
            const cntSpan = document.createElement('span');
            cntSpan.textContent = `×${giftCount || 1}`;
            meta.append(valSpan, cntSpan);

            card.append(img, nameDiv, meta);

            card.addEventListener('click', () => {
                openModal(unit, faction, giftName, giftValue, giftCount);
            });

            return card;
        }

        // ============================================================
        //  5. 模态弹窗
        // ============================================================
        let currentImages = [];
        let currentIndex = 0;

        function openModal(unit, faction, giftName, giftValue, giftCount) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const carouselImg = document.getElementById('modalCarouselImg');
            const nav = document.getElementById('carouselNav');
            const meta = document.getElementById('modalMeta');
            const desc = document.getElementById('modalDesc');
            const video = document.getElementById('modalVideo');

            title.textContent = unit.name;

            const imgNames = unit.images && unit.images.length > 0 ? unit.images : ['profile.jpg'];
            currentImages = imgNames.map(name => faction + '/' + name);
            currentIndex = 0;

            carouselImg.src = currentImages[0] || 'profile.jpg';
            carouselImg.alt = unit.name;
            carouselImg.onerror = function() { this.src = 'profile.jpg'; };

            nav.innerHTML = '';
            if (currentImages.length > 1) {
                const leftBtn = document.createElement('button');
                leftBtn.textContent = '‹';
                leftBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    changeImage(-1);
                });
                nav.appendChild(leftBtn);

                for (let i = 0; i < currentImages.length; i++) {
                    const dot = document.createElement('button');
                    dot.className = 'dot' + (i === 0 ? ' active' : '');
                    dot.dataset.index = i;
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToImage(i);
                    });
                    nav.appendChild(dot);
                }

                const rightBtn = document.createElement('button');
                rightBtn.textContent = '›';
                rightBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    changeImage(1);
                });
                nav.appendChild(rightBtn);
                nav.style.display = 'flex';
            } else {
                nav.style.display = 'none';
            }

            // 元信息（去掉emoji）
            meta.innerHTML = `
                <span>标签: ${unit.tag || '未分类'}</span>
                <span>礼物: ${giftName}</span>
                <span>价值: ${giftValue || 0} 电池</span>
                <span>出场: ×${giftCount || 1}</span>
            `;

            desc.textContent = unit.description || '暂无介绍。';

            const videoSrc = unit.video ? '视频/' + unit.video : '';
            if (videoSrc) {
                video.style.display = 'block';
                const source = video.querySelector('source');
                if (source) {
                    source.src = videoSrc;
                } else {
                    const newSource = document.createElement('source');
                    newSource.src = videoSrc;
                    newSource.type = 'video/mp4';
                    video.appendChild(newSource);
                }
                video.load();
            } else {
                video.style.display = 'none';
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function changeImage(delta) {
            const total = currentImages.length;
            if (total === 0) return;
            currentIndex = (currentIndex + delta + total) % total;
            goToImage(currentIndex);
        }

        function goToImage(index) {
            const total = currentImages.length;
            if (total === 0) return;
            currentIndex = Math.max(0, Math.min(index, total - 1));
            const img = document.getElementById('modalCarouselImg');
            img.src = currentImages[currentIndex] || 'profile.jpg';
            img.onerror = function() { this.src = 'profile.jpg'; };

            const dots = document.querySelectorAll('#carouselNav .dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            const video = document.getElementById('modalVideo');
            video.pause();
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft' && document.getElementById('modalOverlay').classList.contains('active')) {
                changeImage(-1);
            }
            if (e.key === 'ArrowRight' && document.getElementById('modalOverlay').classList.contains('active')) {
                changeImage(1);
            }
        });

        // ============================================================
        //  6. 启动
        // ============================================================
        loadData();

        document.getElementById('avatarImg').onerror = function() {
            this.src = 'profile.jpg';
        };
    </script>

</body>
</html>
