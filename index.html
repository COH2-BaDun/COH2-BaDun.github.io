<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B站巴顿英雄连2弹幕游戏</title>
    <!-- Font Awesome 图标库 (坦克图标) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #1a1a1a;
            color: #e8e8e8;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #242424;
            border-radius: 24px;
            padding: 28px 32px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #3a3a3a;
        }

        /* ---- 头部 ---- */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid #3a3a3a;
            padding-bottom: 20px;
            margin-bottom: 28px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            font-size: 42px;
            color: #d4a84b;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4a84b;
            background: #2a2a2a;
        }

        .header-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f5d98f, #d4a84b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-sub {
            margin-left: auto;
            font-size: 16px;
            background: #2e2e2e;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #4a4a4a;
            transition: 0.2s;
        }

        .header-sub a {
            color: #7fc1ff;
            text-decoration: none;
            font-weight: 500;
        }

        .header-sub a:hover {
            color: #a8d4ff;
            text-decoration: underline;
        }

        /* ---- 直播间播放窗口 ---- */
        .live-section {
            margin-bottom: 40px;
            border-radius: 16px;
            overflow: hidden;
            background: #0f0f0f;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: 0.25s;
            border: 1px solid #333;
        }

        .live-section:hover {
            border-color: #d4a84b;
        }

        .live-iframe {
            width: 100%;
            height: 420px;
            border: none;
            display: block;
        }

        /* ---- 单位展示区 ---- */
        .units-section {
            margin-top: 10px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 18px;
            padding-left: 6px;
            border-left: 5px solid #d4a84b;
            padding-left: 16px;
        }

        .faction-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .faction-tab {
            padding: 10px 28px;
            border-radius: 40px;
            background: #2e2e2e;
            border: 1px solid #444;
            color: #ccc;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .faction-tab:hover {
            background: #3a3a3a;
            border-color: #666;
        }

        .faction-tab.active {
            background: #d4a84b;
            color: #1a1a1a;
            border-color: #d4a84b;
            box-shadow: 0 4px 14px rgba(212, 168, 75, 0.3);
        }

        .faction-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .faction-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0.4;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-block {
            margin-bottom: 36px;
        }

        .category-label {
            font-size: 20px;
            font-weight: 600;
            color: #d4a84b;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-label i {
            font-size: 20px;
            color: #aaa;
        }

        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .unit-card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 14px 14px 18px;
            border: 1px solid #333;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: default;
        }

        .unit-card:hover {
            border-color: #d4a84b;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .unit-media {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            border-radius: 10px;
            background: #111;
            margin-bottom: 10px;
            border: 1px solid #2a2a2a;
        }

        .unit-media.video {
            background: #0a0a0a;
        }

        .unit-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            color: #f0f0f0;
        }

        .unit-desc {
            font-size: 13px;
            color: #aaa;
            line-height: 1.4;
            margin: 6px 0 10px;
            flex: 1;
        }

        .unit-gift {
            font-size: 12px;
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 20px;
            color: #d4a84b;
            border: 1px solid #3a3a3a;
            display: inline-block;
            margin-top: 4px;
        }

        .empty-tip {
            color: #666;
            text-align: center;
            padding: 40px 0;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-sub {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
            .header-title {
                font-size: 20px;
            }
            .live-iframe {
                height: 260px;
            }
            .unit-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }
            .faction-tab {
                padding: 8px 18px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .header-icon {
                font-size: 30px;
            }
            .avatar {
                width: 48px;
                height: 48px;
            }
            .unit-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="header-left">
                <i class="fas fa-tank header-icon"></i>
                <img src="头像.jpg" alt="头像" class="avatar" />
                <span class="header-title">B站巴顿英雄连2弹幕游戏</span>
            </div>
            <div class="header-sub">
                <a href="https://live.bilibili.com/1987060053" target="_blank">
                    <i class="fas fa-external-link-alt" style="margin-right:6px;"></i>
                    https://live.bilibili.com/1987060053
                </a>
            </div>
        </header>

        <!-- ===== 直播间播放窗口 ===== -->
        <section class="live-section">
            <iframe
                class="live-iframe"
                src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=1987060053"
                allowfullscreen
                loading="lazy"
                title="B站直播间"
            ></iframe>
        </section>

        <!-- ===== 单位展示 ===== -->
        <section class="units-section">
            <h2 class="section-title"><i class="fas fa-swords" style="margin-right:12px;"></i>作战单位图鉴</h2>

            <div class="faction-tabs" id="factionTabs">
                <span class="faction-tab active" data-faction="allies">盟军</span>
                <span class="faction-tab" data-faction="axis">帝国</span>
            </div>

            <div class="faction-content active" id="contentAllies"></div>
            <div class="faction-content" id="contentAxis"></div>
        </section>
    </div>

    <script>
        // ============================================================
        //  数据加载 & 渲染
        // ============================================================
        let unitData = null;

        // 礼物 → 单位数量映射 (用于展示)
        const GIFT_MAP = {
            '小花花': 1, '你真好看': 10, '棒棒糖': 50, '千纸鹤': 52,
            '喜欢你': 99, '做我的小猫': 99, '音乐盒': 99, '钻石戒指': 199,
            '花式夸夸': 299, '灿烂烟花': 520, '急速超跑': 1000,
            '人气票': 1, '比心': 10, '心动时刻': 50, '情书': 52,
            '捏捏小脸': 99, '水晶鞋': 99, '撒花': 99, '告白花束': 199,
            '流星雨': 299, '旋转木马': 520, '私人飞机': 1000
        };

        // 单位名称 → 对应礼物 (按阵营)
        const UNIT_GIFT = {
            '冲锋兵': { allies: '小花花', axis: '人气票' },
            '冲锋兵2': { allies: '小花花', axis: '人气票' },
            '冲锋兵3': { allies: '小花花', axis: '人气票' },
            '火箭筒兵': { allies: '小花花', axis: '人气票' },
            '机枪兵': { allies: '小花花', axis: '人气票' },
            '机枪兵2': { allies: '小花花', axis: '人气票' },
            '机枪兵3': { allies: '小花花', axis: '人气票' },
            '狙击兵': { allies: '小花花', axis: '人气票' },
            '狙击兵2': { allies: '小花花', axis: '人气票' },
            '喷火兵': { allies: '小花花', axis: '人气票' },
            '手枪军官': { allies: '小花花', axis: '人气票' },
            '掷弹筒兵': { allies: '小花花', axis: '人气票' },
            '重机枪兵': { allies: '小花花', axis: '人气票' },
            '步战车': { allies: '你真好看', axis: '比心' },
            '装甲车': { allies: '你真好看', axis: '比心' },
            '轻型坦克': { allies: '棒棒糖', axis: '心动时刻' },
            '喷火坦克': { allies: '棒棒糖', axis: '心动时刻' },
            '中型坦克': { allies: '千纸鹤', axis: '情书' },
            '重型坦克': { allies: '千纸鹤', axis: '情书' },
            '超级坦克': { allies: '喜欢你', axis: '捏捏小脸' },
            '管风琴': { allies: '做我的小猫', axis: '水晶鞋' },
            '喀秋莎': { allies: '音乐盒', axis: '撒花' },
            '斯图卡': { allies: '钻石戒指', axis: '告白花束' },
            '灰熊': { allies: '花式夸夸', axis: '流星雨' },
            '榴弹炮': { allies: '灿烂烟花', axis: '旋转木马' },
            '航空编队': { allies: '急速超跑', axis: '私人飞机' }
        };

        function getGiftForUnit(unitName, faction) {
            const map = UNIT_GIFT[unitName];
            if (!map) return '—';
            return faction === 'allies' ? map.allies : map.axis;
        }

        function getGiftBattery(giftName) {
            return GIFT_MAP[giftName] || '?';
        }

        function renderFaction(factionKey, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const faction = unitData[factionKey];
            if (!faction) {
                container.innerHTML = '<div class="empty-tip">暂无数据</div>';
                return;
            }

            const categories = ['步兵', '装甲', '远程'];
            let html = '';

            categories.forEach(cat => {
                const items = faction[cat] || [];
                if (items.length === 0) return;

                let icon = 'fa-user';
                if (cat === '装甲') icon = 'fa-shield-alt';
                else if (cat === '远程') icon = 'fa-rocket';

                html += `<div class="category-block">
                    <div class="category-label"><i class="fas ${icon}"></i> ${cat}</div>
                    <div class="unit-grid">`;

                items.forEach(unit => {
                    const name = unit.name;
                    const desc = unit.desc || '—';
                    const imgPath = unit.image || '';
                    const videoPath = '视频/测试.mp4';
                    const hasImage = imgPath && imgPath.length > 0;
                    const giftName = getGiftForUnit(name, factionKey);
                    const battery = getGiftBattery(giftName);

                    html += `
                        <div class="unit-card">
                            ${hasImage ? 
                                `<img src="${imgPath}" alt="${name}" class="unit-media" loading="lazy" />` :
                                `<video src="${videoPath}" class="unit-media video" muted loop playsinline preload="metadata"></video>`
                            }
                            <div class="unit-name">${name}</div>
                            <div class="unit-desc">${desc}</div>
                            <span class="unit-gift"><i class="fas fa-gift" style="margin-right:4px;"></i>${giftName} ${battery}电池</span>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            if (html === '') {
                html = '<div class="empty-tip">该阵营暂无单位</div>';
            }
            container.innerHTML = html;

            container.querySelectorAll('video').forEach(vid => {
                vid.addEventListener('mouseenter', () => { vid.play().catch(() => {}); });
                vid.addEventListener('mouseleave', () => { vid.pause(); });
                vid.addEventListener('click', () => {
                    if (vid.paused) vid.play().catch(() => {});
                    else vid.pause();
                });
            });
        }

        function setupTabs() {
            const tabs = document.querySelectorAll('.faction-tab');
            const contents = {
                allies: document.getElementById('contentAllies'),
                axis: document.getElementById('contentAxis')
            };

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    const faction = this.dataset.faction;
                    Object.keys(contents).forEach(key => {
                        contents[key].classList.toggle('active', key === faction);
                    });

                    if (unitData) {
                        renderFaction('allies', 'contentAllies');
                        renderFaction('axis', 'contentAxis');
                        Object.keys(contents).forEach(key => {
                            contents[key].classList.toggle('active', key === faction);
                        });
                    }
                });
            });
        }

        function loadData() {
            fetch('data.json')
                .then(res => {
                    if (!res.ok) throw new Error('无法加载 data.json');
                    return res.json();
                })
                .then(data => {
                    unitData = data;
                    renderFaction('allies', 'contentAllies');
                    renderFaction('axis', 'contentAxis');
                    const activeTab = document.querySelector('.faction-tab.active');
                    if (activeTab) {
                        const faction = activeTab.dataset.faction;
                        document.getElementById('contentAllies').classList.toggle('active', faction === 'allies');
                        document.getElementById('contentAxis').classList.toggle('active', faction === 'axis');
                    }
                })
                .catch(err => {
                    console.error('加载 data.json 失败:', err);
                    document.getElementById('contentAllies').innerHTML =
                        '<div class="empty-tip">⚠️ 数据加载失败，请确保 data.json 存在于当前目录</div>';
                    document.getElementById('contentAxis').innerHTML =
                        '<div class="empty-tip">⚠️ 数据加载失败</div>';
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            setupTabs();
            loadData();
        });
    </script>
</body>
</html>
